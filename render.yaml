# Render Blueprint for the Amharic Lyrics API.
#
# This blueprint expects an existing Render Postgres database. Paste its
# **Internal Database URL** (Postgres -> Connect) into DATABASE_URL when Render
# prompts for it (or set it later under the service's Environment tab).
#
# - Internal URL: postgresql://USER:PASSWORD@INTERNAL_HOST:5432/DATABASE
#   Use it when the web service and database are in the same region.
# - External URL: postgresql://USER:PASSWORD@EXTERNAL_HOST:5432/DATABASE?sslmode=require
#   Use it only from your machine or CI; Render requires TLS externally.
#
# If you would rather have Render provision a new database, restore a
# `databases:` block and replace the DATABASE_URL entry below with:
#   - key: DATABASE_URL
#     fromDatabase:
#       name: amharic-lyrics-db
#       property: connectionString

services:
  - type: web
    name: amharic-lyrics-api-platform
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /health/ready
    buildCommand: |
      npm install --include=dev
      npx prisma generate
      npx prisma migrate deploy
      npx prisma db seed
      npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: "7"
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
      - key: LOG_LEVEL
        value: info

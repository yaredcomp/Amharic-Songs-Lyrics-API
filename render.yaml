# Render Blueprint for the Amharic Lyrics API.
#
# - Deploying with this Blueprint creates the Postgres instance below and injects
#   DATABASE_URL automatically (Render's internal connection URL).
# - If you already created a Postgres database manually, remove the `databases:`
#   block and the `fromDatabase` entry, then set DATABASE_URL yourself under the
#   service's Environment tab. Use the Internal Database URL when the web service
#   and database are in the same region; the External Database URL must include
#   `?sslmode=require`.
# - Keep the service and database in the same region or internal URLs will not resolve.
databases:
  - name: amharic-lyrics-db
    plan: free
    databaseName: amharic_lyrics
    user: amharic_lyrics_user

services:
  - type: web
    name: amharic-lyrics-api-platform
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /health/ready
    buildCommand: |
      npm install --include=dev
      npx prisma generate
      npx prisma migrate deploy
      npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: amharic-lyrics-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: "7"
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
      - key: LOG_LEVEL
        value: info

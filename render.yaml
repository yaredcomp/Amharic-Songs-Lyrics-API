databases:
  - name: amharic-lyrics-db
    plan: free
    databaseName: amharic_lyrics
    user: amharic_lyrics_user

services:
  - type: web
    name: amharic-lyrics-api-platform
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /health/ready
    buildCommand: |
      npm install
      npx prisma generate
      npx prisma migrate deploy
      npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: amharic-lyrics-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
